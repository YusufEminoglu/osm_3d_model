<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="pipeTitle pipeDesc">
<title id="pipeTitle">Export pipeline</title>
<desc id="pipeDesc">A study area travels through the Overpass API and a GeoJSON export into the Three.js city viewer.</desc>
<defs>
<linearGradient id="pipeBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf8f5"/><stop offset="1" stop-color="#eef4f1"/></linearGradient>
<path id="track" d="M 96 154 H 1024" fill="none"/>
</defs>
<rect width="1120" height="300" rx="24" fill="url(#pipeBg)"/>
<rect x="1" y="1" width="1118" height="298" rx="24" fill="none" stroke="#b8978a" stroke-opacity="0.4" stroke-width="2"/>
<text x="40" y="52" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="22" font-weight="800" fill="#4d3d38">From a map view to a city you can walk through</text>
<path d="M 96 154 H 1024" stroke="#b8978a" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
<g><rect x="40" y="96" width="232" height="116" rx="18" fill="#ffffff" stroke="#b8978a" stroke-opacity="0.28" stroke-width="1.5"/><rect x="40" y="96" width="232" height="116" rx="18" fill="#e8f2ec" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.36" dur="8s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="40" y="96" width="232" height="116" rx="18" fill="none" stroke="#8a675c" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.3" dur="8s" begin="0.0s" repeatCount="indefinite"/></rect><text x="64" y="144" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#4d3d38">Study area</text><text x="64" y="172" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="13.5" fill="#7a655d">canvas extent or selection</text><text x="64" y="196" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#b8978a" letter-spacing="1.4">STEP 1</text></g>
<g><rect x="312" y="96" width="232" height="116" rx="18" fill="#ffffff" stroke="#b8978a" stroke-opacity="0.28" stroke-width="1.5"/><rect x="312" y="96" width="232" height="116" rx="18" fill="#f6e6dc" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.36" dur="8s" begin="2.0s" repeatCount="indefinite"/></rect><rect x="312" y="96" width="232" height="116" rx="18" fill="none" stroke="#8a675c" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.3" dur="8s" begin="2.0s" repeatCount="indefinite"/></rect><text x="336" y="144" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#4d3d38">Overpass</text><text x="336" y="172" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="13.5" fill="#7a655d">3 mirrors, one retry each</text><text x="336" y="196" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#b8978a" letter-spacing="1.4">STEP 2</text></g>
<g><rect x="584" y="96" width="232" height="116" rx="18" fill="#ffffff" stroke="#b8978a" stroke-opacity="0.28" stroke-width="1.5"/><rect x="584" y="96" width="232" height="116" rx="18" fill="#e7edf6" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.36" dur="8s" begin="4.0s" repeatCount="indefinite"/></rect><rect x="584" y="96" width="232" height="116" rx="18" fill="none" stroke="#8a675c" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.3" dur="8s" begin="4.0s" repeatCount="indefinite"/></rect><text x="608" y="144" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#4d3d38">GeoJSON</text><text x="608" y="172" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="13.5" fill="#7a655d">native OSM tags kept</text><text x="608" y="196" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#b8978a" letter-spacing="1.4">STEP 3</text></g>
<g><rect x="856" y="96" width="232" height="116" rx="18" fill="#ffffff" stroke="#b8978a" stroke-opacity="0.28" stroke-width="1.5"/><rect x="856" y="96" width="232" height="116" rx="18" fill="#efe7f4" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.36" dur="8s" begin="6.0s" repeatCount="indefinite"/></rect><rect x="856" y="96" width="232" height="116" rx="18" fill="none" stroke="#8a675c" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.3" dur="8s" begin="6.0s" repeatCount="indefinite"/></rect><text x="880" y="144" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#4d3d38">Viewer</text><text x="880" y="172" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="13.5" fill="#7a655d">procedural 3D city</text><text x="880" y="196" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#b8978a" letter-spacing="1.4">STEP 4</text></g>
<circle r="9" fill="#8a675c"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.335;0.335;0.665;0.665;1;1;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" calcMode="linear"><mpath href="#track"/></animateMotion></circle><circle r="9" fill="none" stroke="#8a675c" stroke-width="2" opacity="0.6"><animate attributeName="r" values="9;22;9" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.335;0.335;0.665;0.665;1;1;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" calcMode="linear"><mpath href="#track"/></animateMotion></circle>
<text x="40" y="266" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="13.5" fill="#7a655d">Downloads use QGIS’s own network stack, so the plugin reaches the internet wherever QGIS does — proxy, TLS and certificates included.</text>
</svg>